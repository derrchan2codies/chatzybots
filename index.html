<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Chat</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Full-screen notice overlay */
  .notice-overlay {
    position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .notice-box {
    position:relative; width:100%; max-width:520px;
    background:#FFFFFF; color:#17202B; border-radius:12px;
    padding:48px 32px 40px; box-shadow:0 20px 60px rgb(0 0 0 / .3);
    text-align:center; font-size:18px; line-height:1.5;
  }
  .notice-close {
    position:absolute; top:10px; right:10px; width:36px; height:36px;
    background:transparent; border:none; border-radius:8px;
    font-size:22px; line-height:1; color:#17202B; cursor:pointer;
  }
  .notice-close:hover { background:#EEF0F4; }
</style>
</head>
<body>
<header class="top-bar">
  <a class="home-link" href="index.html" aria-label="Home">
    <svg class="home-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
      <path fill="#FFFFFF" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3z"/>
    </svg>
  </a>
  <a class="logout-btn" href="index.html">logout</a>
</header>

<div class="logo-row"><img src="logo.png" alt="Logo"></div>

<main class="chat-panel">
  <section id="log" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"></section>
  <form id="chat-form" class="chat-form" autocomplete="off">
    <input id="message" class="chat-input" type="text" name="message" aria-label="Message" required>
    <button id="send" class="send-btn" type="submit">send</button>
  </form>
</main>

<!-- Full-screen notice (shown whenever the decision model answers "no") -->
<div id="notice" class="notice-overlay" role="dialog" aria-modal="true" aria-labelledby="notice-text" hidden>
  <div class="notice-box">
    <button id="notice-close" class="notice-close" type="button" aria-label="Close">✕</button>
    <p id="notice-text">Please kindly proceed to you nearest clinical provider</p>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const history = [];
const NOTICE_TEXT = 'Please kindly proceed to you nearest clinical provider';

/* ---- Notice box: shown whenever the decision model answers "no" ---- */
function showNotice() {
  $('notice').hidden = false;
  $('notice-close').focus();
}
$('notice-close').onclick = () => { $('notice').hidden = true; };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('notice').hidden) $('notice').hidden = true;
});

/* ---- Chat ---- */
function line(role, text = '') {
  const p = document.createElement('p'), label = document.createElement('strong'), span = document.createElement('span');
  label.textContent = `${role}: `; span.textContent = text;
  p.append(label, span); $('log').append(p); $('log').scrollTop = $('log').scrollHeight;
  return span;
}

$('chat-form').onsubmit = async event => {
  event.preventDefault();
  const text = $('message').value.trim();
  if (!text) return;
  $('message').value = '';
  $('send').disabled = true;
  line('user', text);
  history.push({ role: 'user', content: text });
  const span = line('bot');
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const raw = await response.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`/api/chat returned non-JSON (${response.status}): ${raw.slice(0, 120)}`); }
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);

    if (data.decision === 'no') {
      // Decision model said "no": force the notice box, no gpt-6-luna reply.
      span.textContent = NOTICE_TEXT;
      showNotice();
    } else {
      // Decision model said "yes": show the gpt-6-luna reply.
      span.textContent = data.reply;
      history.push({ role: 'assistant', content: data.reply });
    }
  } catch (error) {
    span.textContent = `[Error: ${error.message}]`;
  } finally {
    $('send').disabled = false;
    $('message').focus();
    $('log').scrollTop = $('log').scrollHeight;
  }
};
</script>
</body>
</html>
